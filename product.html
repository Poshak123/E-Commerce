<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Details</title>
  <link rel="stylesheet" href="style/product.css">
</head>
<body>
  <!-- Header with cart badge -->
  <header class="site-header">
    <a class="logo" href="Home.html">Product Details</a>
    <nav>
      <a href="Home.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>

  <main class="product-main">
    <div class="product-container">
      <div class="product-left">
        <img id="product-image" class="product-img" src="" alt="Product">
      </div>
      <div class="product-right">
        <h1 id="product-name">Product name</h1>
        <p id="product-description" class="product-desc"></p>
        <p id="product-price" class="product-price">0.00</p>

        <label for="size">Size:</label>
        <select id="size" class="size-select">
          <option value="">Select Size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>

        <div class="product-actions">
          <button id="add-to-cart-btn" class="btn primary">🛒 Add to Cart</button>
          <button id="buy-now-btn" class="btn">Buy Now</button>
        </div>
        <p id="product-msg" class="product-msg" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="scripts/product.js"></script>
</body>
</html>
